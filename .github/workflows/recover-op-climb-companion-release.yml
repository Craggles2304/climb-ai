name: Recover OP CLIMB Companion Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  recover-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current release definition
        uses: actions/checkout@v4

      - name: Resolve latest tested Companion artifact
        id: tested
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_version="$(jq -r '.version' climb-ai-v6/companion/package.json)"
          test -n "$expected_version"
          test "$expected_version" != "null"

          run_id="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow 'Build OP CLIMB Companion' \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')"

          test -n "$run_id"
          echo "version=$expected_version" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Recovering tested Companion $expected_version from successful workflow run $run_id."

      - name: Download latest tested installer artifact
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ steps.tested.outputs.version }}
          TESTED_RUN_ID: ${{ steps.tested.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$TESTED_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name op-climb-companion-windows \
            --dir dist

          test -f dist/OP-Climb-Companion-Setup.exe
          test -f dist/OP-Climb-Companion-Setup.exe.blockmap
          test -f dist/latest.yml

          feed_version="$(awk '/^version:/{print $2; exit}' dist/latest.yml)"
          test "$feed_version" = "$EXPECTED_VERSION"

          expected_sha512="$(openssl dgst -sha512 -binary dist/OP-Climb-Companion-Setup.exe | base64 -w0)"
          feed_sha512="$(awk '/^sha512:/{print $2; exit}' dist/latest.yml)"
          test "$expected_sha512" = "$feed_sha512"

      - name: Recreate beta release and publish verified set
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ steps.tested.outputs.version }}
        run: |
          set -euo pipefail

          gh release delete companion-beta --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes >/dev/null 2>&1 || true
          sleep 5
          gh release create companion-beta \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --prerelease \
            --title "OP CLIMB Companion Beta $EXPECTED_VERSION" \
            --notes "Recovered from the latest successful main-branch Windows build for Companion $EXPECTED_VERSION. Unsigned beta build; Windows SmartScreen may show an unknown publisher warning."

          upload_file() {
            local file="$1"
            local name
            name="$(basename "$file")"
            for attempt in 1 2 3 4; do
              echo "Uploading $name, attempt $attempt of 4"
              if timeout 300 gh release upload companion-beta "$file" --repo "$GITHUB_REPOSITORY" --clobber; then
                return 0
              fi
              [ "$attempt" -eq 4 ] || sleep $((attempt * 8))
            done
            echo "Failed to upload $name" >&2
            return 1
          }

          upload_file dist/OP-Climb-Companion-Setup.exe
          upload_file dist/OP-Climb-Companion-Setup.exe.blockmap
          upload_file dist/latest.yml

      - name: Final release verification
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ steps.tested.outputs.version }}
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/companion-beta" --jq '.id')"

          for name in OP-Climb-Companion-Setup.exe OP-Climb-Companion-Setup.exe.blockmap latest.yml; do
            file="dist/$name"
            size="$(stat -c%s "$file")"
            digest="sha256:$(sha256sum "$file" | awk '{print $1}')"
            asset="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" | jq -c --arg name "$name" '.[] | select(.name == $name)' | head -n1)"
            test -n "$asset"
            test "$(jq -r '.state' <<<"$asset")" = 'uploaded'
            test "$(jq -r '.size' <<<"$asset")" = "$size"
            test "$(jq -r '.digest' <<<"$asset")" = "$digest"
          done

          feed_version="$(awk '/^version:/{print $2; exit}' dist/latest.yml)"
          test "$feed_version" = "$EXPECTED_VERSION"
          echo "OP CLIMB Companion $EXPECTED_VERSION recovery set is complete and hash-verified."
