name: Build OP CLIMB Companion

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'climb-ai-v6/companion/**'
      - '.github/workflows/build-op-climb-companion.yml'
  push:
    branches:
      - main
    paths:
      - 'climb-ai-v6/companion/**'
      - '.github/workflows/build-op-climb-companion.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: climb-ai-v6/companion

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Companion dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        run: npm run build:win

      - name: Verify updater assets
        shell: pwsh
        run: |
          $required = @(
            'dist/OP-Climb-Companion-Setup.exe',
            'dist/OP-Climb-Companion-Setup.exe.blockmap',
            'dist/latest.yml'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing updater asset: $file" }
          }

      - name: Torture-test packaged Windows install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path 'dist/OP-Climb-Companion-Setup.exe').Path
          $installedExe = $null
          $appProcess = $null

          try {
            $install = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "NSIS installer exited with code $($install.ExitCode)." }

            $programRoots = @(
              (Join-Path $env:LOCALAPPDATA 'Programs'),
              $env:LOCALAPPDATA
            ) | Where-Object { $_ -and (Test-Path $_) }

            foreach ($root in $programRoots) {
              $installedExe = Get-ChildItem -Path $root -Filter 'OP CLIMB Companion.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($installedExe) { break }
            }
            if (-not $installedExe) { throw 'Installed OP CLIMB Companion.exe was not found after NSIS installation.' }

            $installDir = $installedExe.Directory.FullName
            $requiredPackagedFiles = @(
              (Join-Path $installDir 'resources\app.asar'),
              (Join-Path $installDir 'resources\tracker\main.mjs')
            )
            foreach ($file in $requiredPackagedFiles) {
              if (-not (Test-Path $file)) { throw "Packaged runtime is missing: $file" }
            }

            $appProcess = Start-Process -FilePath $installedExe.FullName -ArgumentList '--hidden' -PassThru
            Start-Sleep -Seconds 10
            if ($appProcess.HasExited) { throw "Installed Companion exited during startup with code $($appProcess.ExitCode)." }

            $protocolKey = 'Registry::HKEY_CURRENT_USER\Software\Classes\opclimb'
            if (-not (Test-Path $protocolKey)) { throw 'opclimb:// protocol registration is missing after packaged startup.' }

            Write-Host "Packaged Companion stayed alive from $($installedExe.FullName)."
            Write-Host 'Packaged tracker resource and opclimb:// protocol registration verified.'
          }
          finally {
            if ($appProcess -and -not $appProcess.HasExited) {
              Stop-Process -Id $appProcess.Id -Force -ErrorAction SilentlyContinue
            }
            if ($installedExe) {
              Get-CimInstance Win32_Process | Where-Object {
                $_.ExecutablePath -and $_.ExecutablePath.StartsWith($installedExe.Directory.FullName, [System.StringComparison]::OrdinalIgnoreCase)
              } | ForEach-Object {
                Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
              }
              $uninstaller = Get-ChildItem -Path $installedExe.Directory.FullName -Filter 'Uninstall*.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($uninstaller) {
                $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
                if ($uninstall.ExitCode -ne 0) { throw "NSIS uninstaller exited with code $($uninstall.ExitCode)." }
              }
            }
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: op-climb-companion-windows
          path: |
            climb-ai-v6/companion/dist/OP-Climb-Companion-Setup.exe
            climb-ai-v6/companion/dist/OP-Climb-Companion-Setup.exe.blockmap
            climb-ai-v6/companion/dist/latest.yml
          if-no-files-found: error

      - name: Publish beta installer and update feed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view companion-beta --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create companion-beta --repo $env:GITHUB_REPOSITORY --prerelease --title 'OP CLIMB Companion Beta' --notes 'Unsigned Windows beta build for controlled OP CLIMB testing. Windows SmartScreen may show an unknown publisher warning during the beta.'
            if ($LASTEXITCODE -ne 0) { throw 'Could not create companion-beta release.' }
          }

          $assets = @(
            'OP-Climb-Companion-Setup.exe',
            'OP-Climb-Companion-Setup.exe.blockmap',
            'latest.yml'
          )

          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "Release upload attempt $attempt of 3"
            foreach ($asset in $assets) {
              gh release delete-asset companion-beta $asset --yes --repo $env:GITHUB_REPOSITORY 2>$null
            }

            gh release upload companion-beta `
              'dist/OP-Climb-Companion-Setup.exe' `
              'dist/OP-Climb-Companion-Setup.exe.blockmap' `
              'dist/latest.yml' `
              --repo $env:GITHUB_REPOSITORY

            if ($LASTEXITCODE -eq 0) {
              $names = gh release view companion-beta --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
              $missing = $assets | Where-Object { $_ -notin $names }
              if (-not $missing) {
                Write-Host 'Companion beta updater assets published successfully.'
                exit 0
              }
              Write-Warning "Upload returned success but release is missing: $($missing -join ', ')"
            }

            if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
          }

          throw 'Companion beta release upload failed after 3 attempts.'
