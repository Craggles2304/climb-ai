name: Build OP CLIMB Companion

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'climb-ai-v6/companion/**'
      - '.github/workflows/build-op-climb-companion.yml'
  push:
    branches:
      - main
    paths:
      - 'climb-ai-v6/companion/**'
      - '.github/workflows/build-op-climb-companion.yml'

concurrency:
  group: op-climb-companion-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: climb-ai-v6/companion

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Companion dependencies
        run: npm install --no-audit --no-fund

      - name: Build Windows installer
        run: npm run build:win

      - name: Verify updater assets
        shell: pwsh
        run: |
          $required = @(
            'dist/OP-Climb-Companion-Setup.exe',
            'dist/OP-Climb-Companion-Setup.exe.blockmap',
            'dist/latest.yml'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing updater asset: $file" }
          }

      - name: Torture-test packaged Windows install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Resolve-Path 'dist/OP-Climb-Companion-Setup.exe').Path
          $installedExe = $null
          $appProcess = $null

          try {
            $install = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "NSIS installer exited with code $($install.ExitCode)." }

            $programRoots = @(
              (Join-Path $env:LOCALAPPDATA 'Programs'),
              $env:LOCALAPPDATA
            ) | Where-Object { $_ -and (Test-Path $_) }

            foreach ($root in $programRoots) {
              $installedExe = Get-ChildItem -Path $root -Filter 'OP CLIMB Companion.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($installedExe) { break }
            }
            if (-not $installedExe) { throw 'Installed OP CLIMB Companion.exe was not found after NSIS installation.' }

            $installDir = $installedExe.Directory.FullName
            $requiredPackagedFiles = @(
              (Join-Path $installDir 'resources\app.asar'),
              (Join-Path $installDir 'resources\tracker\main.mjs')
            )
            foreach ($file in $requiredPackagedFiles) {
              if (-not (Test-Path $file)) { throw "Packaged runtime is missing: $file" }
            }

            $appProcess = Start-Process -FilePath $installedExe.FullName -ArgumentList '--hidden' -PassThru
            Start-Sleep -Seconds 10
            if ($appProcess.HasExited) { throw "Installed Companion exited during startup with code $($appProcess.ExitCode)." }

            $protocolKey = 'Registry::HKEY_CURRENT_USER\Software\Classes\opclimb'
            if (-not (Test-Path $protocolKey)) { throw 'opclimb:// protocol registration is missing after packaged startup.' }

            Write-Host "Packaged Companion stayed alive from $($installedExe.FullName)."
            Write-Host 'Packaged tracker resource and opclimb:// protocol registration verified.'
          }
          finally {
            if ($appProcess -and -not $appProcess.HasExited) {
              Stop-Process -Id $appProcess.Id -Force -ErrorAction SilentlyContinue
            }
            if ($installedExe) {
              Get-CimInstance Win32_Process | Where-Object {
                $_.ExecutablePath -and $_.ExecutablePath.StartsWith($installedExe.Directory.FullName, [System.StringComparison]::OrdinalIgnoreCase)
              } | ForEach-Object {
                Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
              }
              $uninstaller = Get-ChildItem -Path $installedExe.Directory.FullName -Filter 'Uninstall*.exe' -File -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($uninstaller) {
                $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
                if ($uninstall.ExitCode -ne 0) { throw "NSIS uninstaller exited with code $($uninstall.ExitCode)." }
              }
            }
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: op-climb-companion-windows
          path: |
            climb-ai-v6/companion/dist/OP-Climb-Companion-Setup.exe
            climb-ai-v6/companion/dist/OP-Climb-Companion-Setup.exe.blockmap
            climb-ai-v6/companion/dist/latest.yml
          if-no-files-found: error

      - name: Publish beta installer and update feed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        timeout-minutes: 15
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'

          gh release view companion-beta --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create companion-beta --repo $env:GITHUB_REPOSITORY --prerelease --title 'OP CLIMB Companion Beta' --notes 'Unsigned Windows beta build for controlled OP CLIMB testing. Windows SmartScreen may show an unknown publisher warning during the beta.'
            if ($LASTEXITCODE -ne 0) { throw 'Could not create companion-beta release.' }
          }

          $releaseId = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/companion-beta" --jq '.id'
          if ($LASTEXITCODE -ne 0 -or -not $releaseId) { throw 'Could not resolve companion-beta release id.' }

          $files = @(
            @{ Name = 'OP-Climb-Companion-Setup.exe'; Path = 'dist/OP-Climb-Companion-Setup.exe'; Type = 'application/x-msdownload' },
            @{ Name = 'OP-Climb-Companion-Setup.exe.blockmap'; Path = 'dist/OP-Climb-Companion-Setup.exe.blockmap'; Type = 'application/octet-stream' },
            @{ Name = 'latest.yml'; Path = 'dist/latest.yml'; Type = 'application/octet-stream' }
          )

          function Remove-ReleaseAsset([string]$name) {
            $json = gh api "repos/$env:GITHUB_REPOSITORY/releases/$releaseId/assets?per_page=100"
            if ($LASTEXITCODE -ne 0) { throw 'Could not list release assets.' }
            $existing = ($json | ConvertFrom-Json) | Where-Object { $_.name -eq $name }
            foreach ($asset in $existing) {
              gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)" *> $null
              if ($LASTEXITCODE -ne 0) { throw "Could not delete stale release asset $name." }
            }
          }

          function Publish-VerifiedAsset($file) {
            $fullPath = (Resolve-Path $file.Path).Path
            $size = (Get-Item $fullPath).Length
            $sha = (Get-FileHash -Path $fullPath -Algorithm SHA256).Hash.ToLowerInvariant()
            $expectedDigest = "sha256:$sha"

            for ($attempt = 1; $attempt -le 3; $attempt++) {
              Write-Host "Publishing $($file.Name), attempt $attempt of 3"
              Remove-ReleaseAsset $file.Name

              $uploadUrl = "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$releaseId/assets?name=$([uri]::EscapeDataString($file.Name))"
              & curl.exe --silent --show-error --fail-with-body --connect-timeout 20 --max-time 240 `
                -X POST `
                -H "Authorization: Bearer $env:GH_TOKEN" `
                -H 'Accept: application/vnd.github+json' `
                -H 'X-GitHub-Api-Version: 2022-11-28' `
                -H "Content-Type: $($file.Type)" `
                --data-binary "@$fullPath" `
                $uploadUrl | Out-Null

              if ($LASTEXITCODE -eq 0) {
                $json = gh api "repos/$env:GITHUB_REPOSITORY/releases/$releaseId/assets?per_page=100"
                if ($LASTEXITCODE -ne 0) { throw 'Could not verify release assets.' }
                $asset = (($json | ConvertFrom-Json) | Where-Object { $_.name -eq $file.Name } | Select-Object -First 1)
                if ($asset -and $asset.state -eq 'uploaded' -and [int64]$asset.size -eq [int64]$size -and $asset.digest -eq $expectedDigest) {
                  Write-Host "Verified $($file.Name): $expectedDigest"
                  return
                }
                Write-Warning "$($file.Name) upload returned but did not verify cleanly."
              }

              if ($attempt -lt 3) { Start-Sleep -Seconds (5 * $attempt) }
            }

            throw "Failed to publish and verify $($file.Name) after 3 attempts."
          }

          foreach ($file in $files) { Publish-VerifiedAsset $file }
          Write-Host 'Companion beta installer, blockmap and updater feed are all uploaded and hash-verified.'
