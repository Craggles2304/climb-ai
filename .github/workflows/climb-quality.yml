name: CLIMB Quality

on:
  push:
    branches: [main]
    paths:
      - 'climb-ai-v6/**'
      - '.github/workflows/climb-quality.yml'
  pull_request:
    paths:
      - 'climb-ai-v6/**'
      - '.github/workflows/climb-quality.yml'

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: climb-ai-v6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: climb-ai-v6/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Combat tests
        run: npm test
