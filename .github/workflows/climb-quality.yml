name: CLIMB Quality

on:
  push:
    branches: [main, dev/combat-engine-batch]
    paths:
      - 'climb-ai-v6/**'
      - '.github/workflows/climb-quality.yml'
  pull_request:
    paths:
      - 'climb-ai-v6/**'
      - '.github/workflows/climb-quality.yml'

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: climb-ai-v6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: climb-ai-v6/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Ability damage type regressions
        run: node --import tsx --test tests/abilityDamageType.test.ts
      - name: Conditional spell variant regressions
        run: node --import tsx --test tests/spellVariants.test.ts
      - name: Execute spell regressions
        run: node --import tsx --test tests/executeSpells.test.ts
      - name: Attack interaction regressions
        run: node --import tsx --test tests/attackInteractions.test.ts
      - name: Galio passive timeline regressions
        run: node --import tsx --test tests/galioPassiveTimeline.test.ts
      - name: Range access regressions
        run: node --import tsx --test tests/rangeAccess.test.ts
      - name: Bot lane regression tests
        run: node --import tsx --test tests/botlane.test.ts
      - name: Core and auth regressions
        continue-on-error: true
        run: node --import tsx --test tests/analytics.test.ts tests/auth.test.ts tests/build.test.ts
      - name: Champion and combo regressions
        continue-on-error: true
        run: node --import tsx --test tests/championMechanics.test.ts tests/championRegistry.test.ts tests/champions.test.ts tests/combos.test.ts tests/confidence.test.ts
      - name: Combat engine regressions
        continue-on-error: true
        run: node --import tsx --test tests/costOfLeak.test.ts tests/damage.test.ts tests/dps.test.ts tests/duel.test.ts tests/duelInteractions.test.ts tests/effects.test.ts tests/formula.test.ts tests/importSpells.test.ts tests/items.test.ts tests/trades.test.ts
      - name: Product regressions
        continue-on-error: true
        run: node --import tsx --test tests/keyMoments.test.ts tests/lane.test.ts tests/liveGame.test.ts tests/mapMatch.test.ts tests/planOrder.test.ts tests/profile.test.ts tests/review.test.ts tests/skillRanks.test.ts tests/tilt.test.ts
