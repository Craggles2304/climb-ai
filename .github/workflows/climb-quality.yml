name: CLIMB Quality

on:
  push:
    branches: [main]
    paths:
      - 'climb-ai-v6/**'
      - '.github/workflows/climb-quality.yml'
  pull_request:
    paths:
      - 'climb-ai-v6/**'
      - '.github/workflows/climb-quality.yml'

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: climb-ai-v6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: climb-ai-v6/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Companion desktop syntax
        run: node --check companion/electron/main.cjs && node --check companion/electron/renderer.js && node --check companion/electron/preload.cjs && node --check companion/electron/remember-v2.js && node --check companion/electron/remember-v6-match-os.js && node --check companion/electron/remember-v7-read-checkpoints.js && node --check companion/electron/remember-v8-causal-coach-router.js && node --check companion/electron/remember-v9-player-coaching-identity.js && node --check companion/electron/remember-v10-adaptive-coaching-session.js && node --check companion/electron/remember-v11-learning-velocity.js && node --check companion/electron/remember-v12-skill-transfer-graph.js && node --check companion/electron/review-v2.js && node --check companion/electron/plan-recognition-review.cjs && node --check companion/electron/review-v2-core.js && node --check companion/electron/review-esports.js && node --check companion/electron/review-v3-read-calibration.js && node --check companion/electron/review-v4-causal-chain.js && node --check companion/electron/review-v5-causal-coach-router.js && node --check companion/electron/review-v6-player-coaching-identity.js && node --check companion/electron/review-v7-adaptive-coaching-session.js && node --check companion/electron/review-v8-learning-velocity.js && node --check companion/electron/review-v9-skill-transfer-graph.js && node --check companion/src/main.mjs && node --test tests/companionPhaseOrder.test.cjs tests/companionRoleInference.test.cjs tests/companionStrategy.test.cjs tests/companionStrategyAccess.test.cjs tests/universalRoleStrategy.test.cjs tests/rememberHud.test.cjs tests/companionMatchOs.test.cjs tests/liveReadCheckpoints.test.cjs tests/causalChainUi.test.cjs tests/causalCoachRouterUi.test.cjs tests/playerCoachingIdentityUi.test.cjs tests/adaptiveCoachingSessionUi.test.cjs tests/learningVelocityUi.test.cjs tests/skillTransferGraphUi.test.cjs tests/reviewEsportsUi.test.cjs tests/planRecognitionReview.test.cjs
      - name: Adaptive ILP evidence regressions
        run: node --import tsx --test tests/adaptiveIlpEvidence.test.ts tests/decisionTwin.test.ts tests/decisionTwinV2.test.ts tests/decisionSimulation.test.ts tests/scenarioMemory.test.ts tests/decisionTransfer.test.ts tests/climbCurriculum.test.ts tests/climbRepLadder.test.ts tests/climbMissionDesign.test.ts tests/decisionPremortem.test.ts tests/decisionGraph.test.ts tests/learningJourney.test.ts tests/ilpCloudMerge.test.ts tests/ilpExplainability.test.ts
      - name: CLIMB Coach Twin adaptation
        run: node --import tsx --test tests/climbCoachTwin.test.ts
      - name: CLIMB Coaching Strategy
        run: node --import tsx --test tests/climbCoachingStrategy.test.ts
      - name: CLIMB Intent Gap
        run: node --import tsx --test tests/climbIntentGap.test.ts
      - name: CLIMB Autonomy Engine
        run: node --import tsx --test tests/climbAutonomy.test.ts
      - name: CLIMB Intervention Value
        run: node --import tsx --test tests/climbInterventionValue.test.ts
      - name: CLIMB Experiment Scheduler
        run: node --import tsx --test tests/climbExperimentScheduler.test.ts
      - name: CLIMB synthetic career lab
        run: node --import tsx --test tests/climbSimulationLab.test.ts
      - name: CLIMB Career Matrix + Autonomous Curriculum + Coach Bench
        run: node --import tsx --test tests/climbCareerMatrix.test.ts tests/climbAutonomousCurriculumV6.test.ts tests/climbCoachBench.test.ts
      - name: CLIMB Career Experience
        run: node --import tsx --test tests/climbCareerExperience.test.ts
      - name: Stage 9 Companion Match OS
        run: node --import tsx --test tests/companionMatchContract.test.ts
      - name: Stage 10 Live Read Calibration
        run: node --import tsx --test tests/gameReadCalibration.test.ts
      - name: Stage 11 Decision Causal Chain
        run: node --import tsx --test tests/decisionCausalChain.test.ts tests/decisionCausalProfile.test.ts
      - name: Stage 12 Causal Coach Router
        run: node --import tsx --test tests/causalCoachRouter.test.ts
      - name: Stage 13 Player Coaching Identity
        run: node --import tsx --test tests/playerCoachingIdentity.test.ts
      - name: Stage 14 Adaptive Coaching Sessions
        run: node --import tsx --test tests/adaptiveCoachingSession.test.ts
      - name: Stage 15 Learning Velocity + Coaching Effectiveness
        run: node --import tsx --test tests/learningVelocity.test.ts
      - name: Stage 16 Skill Transfer Graph
        run: node --import tsx --test tests/skillTransferGraph.test.ts
      - name: Stage 16 Skill Transfer Graph
        run: node --import tsx --test tests/skillTransferGraph.test.ts
      - name: Stage 4 beta hardening
        run: node --import tsx --test tests/betaHardening.test.ts
      - name: Stage 5 founding beta validation
        run: node --import tsx --test tests/foundingBetaValidation.test.ts
      - name: Stage 6 beta operations
        run: node --import tsx --test tests/betaOperations.test.ts
      - name: Stage 7 controlled founding beta
        run: node --import tsx --test tests/controlledBetaCohort.test.ts
      - name: Ability damage type regressions
        run: node --import tsx --test tests/abilityDamageType.test.ts
      - name: Conditional spell variant regressions
        run: node --import tsx --test tests/spellVariants.test.ts
      - name: Execute spell regressions
        run: node --import tsx --test tests/executeSpells.test.ts
      - name: Attack interaction regressions
        run: node --import tsx --test tests/combatDecimal.test.ts tests/attackTimingPrecision.test.ts tests/attackInteractions.test.ts
      - name: Basic attack timing regressions
        run: node --import tsx --test tests/attackTiming.test.ts
      - name: Galio passive timeline regressions
        run: node --import tsx --test tests/galioPassiveTimeline.test.ts
      - name: Bot lane regression tests
        run: node --import tsx --test tests/botlane.test.ts
      - name: Live tracker regressions
        run: node --import tsx --test tests/liveGame.test.ts tests/liveStrength.test.ts
      - name: Core and auth regressions
        run: node --import tsx --test tests/analytics.test.ts tests/auth.test.ts tests/build.test.ts
      - name: Champion and combo regressions
        run: node --import tsx --test tests/championMechanics.test.ts tests/championRegistry.test.ts tests/champions.test.ts tests/combos.test.ts tests/confidence.test.ts tests/compositionIntelligence.test.ts tests/rememberPlan.test.ts
      - name: Coach rank win-condition benchmarks
        run: node --import tsx --test tests/coachWinConditionEval.test.ts tests/draftRoleResolver.test.ts tests/coach100DraftTorture.test.ts tests/coach300DraftStress.test.ts tests/coach200OffMetaStress.test.ts tests/coach50FakeGamePlaybookStress.test.ts tests/carryRoleMap.test.ts tests/frozenContingencyMap.test.ts
      - name: Combat engine regressions
        run: node --import tsx --test tests/costOfLeak.test.ts tests/damage.test.ts tests/dps.test.ts tests/duel.test.ts tests/duelInteractions.test.ts tests/effects.test.ts tests/formula.test.ts tests/importSpells.test.ts tests/items.test.ts tests/trades.test.ts
      - name: Product regressions
        run: node --import tsx --test tests/keyMoments.test.ts tests/lane.test.ts tests/mapMatch.test.ts tests/planOrder.test.ts tests/profile.test.ts tests/review.test.ts tests/skillRanks.test.ts tests/tilt.test.ts
