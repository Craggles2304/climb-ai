<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OP CLIMB Match Panel</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b120e;color:#f1f7ed;font:12px Segoe UI,Arial,sans-serif;border:1px solid #5e8242;min-height:100vh}.head{height:42px;background:#1b2d1b;display:flex;align-items:center;justify-content:space-between;padding:0 12px;-webkit-app-region:drag;user-select:none}.head b{font-size:14px;letter-spacing:.09em;color:#d6ff5b}.head span{font-size:10px;color:#bbd3b4}.body{padding:15px}.label{font-size:9px;font-weight:800;letter-spacing:.16em;color:#bff364;text-transform:uppercase}.mission{font-size:20px;font-weight:800;line-height:1.1;text-transform:uppercase;margin:7px 0 15px}.build{border-top:1px solid #344b35;padding-top:12px}.items{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0}.item{border:1px solid #3d593e;background:#1b2a1d;padding:6px 7px;font-size:10px;font-weight:700}.reason{color:#b4c8b0;line-height:1.35;font-size:10px;max-height:32px;overflow:hidden}.actions{display:flex;gap:7px;margin-top:13px}button{-webkit-app-region:no-drag;cursor:pointer;border:1px solid #648044;background:#21341e;color:#e7f3d6;padding:8px 10px;font-size:10px;font-weight:800;text-transform:uppercase;flex:1}button:first-child{background:#d6ff5b;color:#14200b}#count{color:#9eb59b;font-size:10px;margin-top:8px}.empty{color:#9eb59b}.record{color:#bcf58a}
</style></head><body><div class="head"><b>OP CLIMB</b><span class="record">● RECORDING LOCALLY</span></div><div class="body"><div class="label" id="champion">YOUR MISSION</div><div class="mission" id="mission">Stay with your development focus</div><div class="build"><div class="label">Build against this draft · locked pre-game</div><div class="items" id="items"><span class="empty">Your draft build will appear here.</span></div><div class="reason" id="reason"></div></div><div class="actions"><button id="mark">Mark moment</button><button id="open">Open Companion</button></div><div id="count">0 moments marked</div></div><script>
const $=id=>document.getElementById(id);function render(state){const brief=state?.frozenBrief||state;const team=brief?.teamPlan||state?.teamPlan||{},build=team.adaptiveBuild||team.rememberPlan?.adaptiveBuild||null,mission=Array.isArray(team.missionTips)?team.missionTips[0]:null;const champ=brief?.matchup?.champion||brief?.matchup?.plan?.you?.name||'';$('champion').textContent=champ?champ.toUpperCase()+' · YOUR MISSION':'YOUR MISSION';$('mission').textContent=mission?.cue||'Stay with your development focus';const items=[...(Array.isArray(build?.core)?build.core.slice(0,2):[]),build?.draftItem,build?.boots].filter(Boolean);$('items').replaceChildren();if(items.length){for(const item of items){const chip=document.createElement('span');chip.className='item';chip.textContent=String(item.name||'Item');chip.title=String(item.why||'');$('items').append(chip)}}else{$('items').textContent='Build unavailable for this draft.'}$('reason').textContent=String(build?.read||build?.rule||'');const count=state?.markedMoments?.length||0;$('count').textContent=count+' moment'+(count===1?'':'s')+' marked · Ctrl+Shift+M'}window.matchPanel.getState().then(render);window.matchPanel.onState(render);$('mark').onclick=async()=>{const result=await window.matchPanel.markMoment();if(!result?.ok)$('count').textContent=result?.error||'Could not save moment.'};$('open').onclick=()=>window.matchPanel.openMain();
</script></body></html>
